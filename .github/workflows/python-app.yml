# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd
import xlsxwriter  # moteur pour écrire en .xlsx

# ---- Inputs / Outputs
SRC = dataiku.Dataset("Run_649_EER_PART_")   # ton dataset source
OUT = dataiku.Folder("psWuQcPE")             # ton Managed Folder de sortie
COL_REGION = "Libelle Region"                # nom exact de la colonne

# ---- Utile : nom de fichier "safe"
def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")
    return s or "NA"

# ---- Lecture
df = SRC.get_dataframe()

# ---- Écriture : un fichier Excel (.xlsx) par région, tout en TEXTE
for region, sub in df.groupby(COL_REGION, dropna=False):
    safe = slugify(region)
    filename = f"{safe}_Run_649_EER_PART.xlsx"

    # Tout en texte pour préserver les zéros initiaux (IDs, codes, etc.)
    sub_txt = sub.astype(str)

    # Buffer binaire + écriture xlsx
    buf = io.BytesIO()
    with pd.ExcelWriter(buf, engine="xlsxwriter") as writer:
        sub_txt.to_excel(writer, index=False, sheet_name="Données")

    OUT.upload_stream(filename, buf.getvalue())

print("OK : fichiers Excel (.xlsx) créés par région, toutes les colonnes en texte.")
