# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd

# ---- Inputs / Outputs (comme dans ta recette)
SRC = dataiku.Dataset("Run_649_EER_PART_")   # dataset source
OUT = dataiku.Folder("psWuQcPE")             # managed folder de sortie
COL_REGION = "Libelle Region"                # colonne région

# ---- Util : nom de fichier sûr
def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")
    return s or "NA"

# ---- Lecture
df = SRC.get_dataframe()

# ---- Écriture : un .xlsx par région, TOUT en TEXTE
for region, sub in df.groupby(COL_REGION, dropna=False):
    safe = slugify(region)
    filename = f"{safe}_Run_649_EER_PART.xlsx"

    # tout en str => Excel lira comme texte (zéros initiaux conservés)
    sub_txt = sub.astype(str)

    # buffer binaire + écriture .xlsx avec openpyxl
    buf = io.BytesIO()
    with pd.ExcelWriter(buf, engine="openpyxl") as writer:
        sub_txt.to_excel(writer, index=False, sheet_name="Données")
        # (optionnel) forcer explicitement le format texte sur toutes les cellules
        ws = writer.sheets["Données"]
        for row in ws.iter_rows(min_row=2):  # ignore l'entête
            for cell in row:
                cell.number_format = "@"

    OUT.upload_stream(filename, buf.getvalue())

print("OK : fichiers Excel (.xlsx) créés par région, colonnes en texte (zéros préservés).")
