# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd

# ---- Inputs / Outputs
SRC = dataiku.Dataset("Run_649_EER_PART_")     # ton dataset source
OUT = dataiku.Folder("psWuQcPE")               # ton Managed Folder de sortie
COL_REGION = "Libelle Region"                  # nom exact de la colonne région

# ---- Utilitaire : rendre le nom de fichier sûr
def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")
    return s or "NA"

# ---- Lecture
df = SRC.get_dataframe()

# ---- Tout convertir en texte (préserve les 0 initiaux et les formats)
df = df.astype(str)

# ---- Ecriture : un fichier par région
for region, sub in df.groupby(COL_REGION, dropna=False):
    safe = slugify(region)
    filename = f"{safe}_Run_649_EER_PART.csv"

    buf = io.StringIO()
    buf.write("sep=;\n")
    sub.to_csv(buf, index=False, sep=";", line_terminator="\n")
    OUT.upload_stream(filename, buf.getvalue().encode("utf-8-sig"))

print("✅ OK : fichiers CSV créés par région, toutes les colonnes en texte (zéros préservés).")
