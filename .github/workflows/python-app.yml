# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd

# ---- Inputs / Outputs
SRC = dataiku.Dataset("version")          # ton dataset source
OUT = dataiku.Folder("TMIO8X8i")          # ton Managed Folder de sortie
COL_REGION = "RÉGION"                     # nom exact de la colonne

# ---- Util: rendre le nom de fichier sûr (supprime accents, espaces, etc.)
def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9._-]+", "_", s).strip("_")
    return s or "NA"

# ---- Lecture
df = SRC.get_dataframe()

# ---- Ecriture: un fichier par région
for region, sub in df.groupby(COL_REGION, dropna=False):
    safe = slugify(region)
    # dossier type partition pour rester propre
    path = f"region={safe}/data.csv"

    buf = io.StringIO()
    sub.to_csv(buf, index=False)
    OUT.upload_stream(path, buf.getvalue().encode("utf-8"))

print("OK : fichiers créés par région.")
