# -*- coding: utf-8 -*-
import dataiku, pandas as pd, re

def norm(s): return re.sub(r"\s+", " ", str(s).strip().lower())
def is_yes(v): return ("" if v is None else str(v)).strip().upper() == "O"

COL = "COALESCE(RC.CFONFDCEXT, RC.CFONFDCINT)"
FDC_CODES = ["CTX","CID","CRD","CSS","COS","CSU","CSE","SUC","CLO"]

# --- lire dataset source ---
ds = dataiku.Dataset("Shared_Documents")   # adapte si besoin
df = ds.get_dataframe()
df["_var_raw"]  = df["Variable"].astype(str).str.strip()

filters_fdc = {}
rows = []

for code in FDC_CODES:
    sub = df[df["_var_raw"] == code]
    if sub.empty:
        continue

    flag = str(sub["OUI_NON"].dropna().astype(str).iloc[0]) if sub["OUI_NON"].notna().any() else ""
    if is_yes(flag):
        clause = f"{COL} NOT IN ('{code}')"
        var_name = f"filters_fdc.{code.lower()}"
        filters_fdc[var_name] = clause
        rows.append({"name": var_name, "label": code, "value": clause})
    # si N/vide : on n'ajoute rien (pas d'exclusion)

# --- gros filtre (AND des exclusions actives) ---
actives = [v for v in filters_fdc.values() if v]
filtre_fdc = " AND ".join(f"({c})" for c in actives) if actives else "1=1"
filters_fdc["filtre_fdc"] = filtre_fdc
rows.append({"name": "filtre_fdc", "label": "Filtre FDC (AND)", "value": filtre_fdc})

# --- écrire variables de projet (sans toucher aux autres) ---
client = dataiku.api_client()
project = client.get_project(dataiku.default_project_key())
vars_obj = project.get_variables()
std = vars_obj.get("standard", {})
std.update(filters_fdc)                      # ex: filters_fdc.ctx, ..., filtre_fdc
vars_obj["standard"] = std
project.set_variables(vars_obj)

# --- dataset de sortie ---
out_df = pd.DataFrame(rows, columns=["name","label","value"])
dataiku.Dataset("VARIABLES_FDC").write_with_schema(out_df)
