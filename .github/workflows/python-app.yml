# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd
import xlsxwriter  # doit être installé

SRC = dataiku.Dataset("Run_649_EER_PART_")
OUT = dataiku.Folder("psWuQcPE")
COL_REGION = "Libelle Region"

def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    s = unicodedata.normalize("NFKD", s).encode("ascii","ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")
    return s or "NA"

df = SRC.get_dataframe()
df[COL_REGION] = df[COL_REGION].fillna("NA")

for region, sub in df.groupby(COL_REGION):
    safe = slugify(region)
    filename = f"{safe}_Run_649_EER_PART.xlsx"

    # IMPORTANT : on force tout en chaîne, sans ajouter d'apostrophe
    sub = sub.fillna("").astype(str)

    buf = io.BytesIO()
    wb = xlsxwriter.Workbook(buf, {'in_memory': True})
    ws = wb.add_worksheet("Données")
    text_fmt = wb.add_format({'num_format': '@'})  # format texte Excel

    # entêtes
    for j, col in enumerate(sub.columns):
        ws.write_string(0, j, col, text_fmt)

    # cellules (écrit en TEXTE, donc 000123 reste 000123)
    for i in range(len(sub)):
        for j, col in enumerate(sub.columns):
            ws.write_string(i+1, j, sub.iloc[i, j], text_fmt)

    wb.close()
    OUT.upload_stream(filename, buf.getvalue())

print("✅ Fichiers Excel créés : colonnes écrites en texte, zéros initiaux conservés, sans apostrophes.")
