# -*- coding: utf-8 -*-
import io, re, unicodedata
import dataiku
import pandas as pd

SRC = dataiku.Dataset("Run_649_EER_PART_")
OUT = dataiku.Folder("psWuQcPE")
COL_REGION = "Libelle Region"

def slugify(value):
    s = str(value) if pd.notna(value) else "NA"
    import unicodedata
    s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
    s = re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")
    return s or "NA"

df = SRC.get_dataframe()

# --- rien d'autre ne change dans ta logique ---

for region, sub in df.groupby(COL_REGION, dropna=False):
    safe = slugify(region)
    filename = f"{safe}_Run_649_EER_PART.csv"

    # >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
    # Forcer texte pour Excel (zéros initiaux préservés)
    FORCE_TEXT_COLS = ["ID Unique"]  # ajoute d'autres noms si besoin

    # 1) Colonnes explicitement listées
    for col in FORCE_TEXT_COLS:
        if col in sub.columns:
            s = sub[col].astype(object).where(sub[col].notna(), "")
            sub[col] = s.astype(str).map(lambda v: "'" + v if v != "" and not v.startswith("'") else v)

    # 2) Toute colonne contenant des nombres très longs (>=11 chiffres)
    for col in sub.columns:
        as_str = sub[col].astype(str)
        if as_str.str.match(r"^\d{11,}$").any():
            sub[col] = as_str.map(lambda v: "'" + v if re.fullmatch(r"\d{11,}", v or "") and not v.startswith("'") else v)
    # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

    buf = io.StringIO()
    buf.write("sep=;\n")
    sub.to_csv(buf, index=False, sep=";", line_terminator="\n")
    OUT.upload_stream(filename, buf.getvalue().encode("utf-8-sig"))

print("✅ OK : CSV par région ; colonnes ID forcées en texte (plus de 1,09E+15).")
